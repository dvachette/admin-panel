name: Deploy admin panel

on:
  push:
    branches:
      - master

# Never run two deployments at the same time (they share the same checkout on the server)
concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: debian
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/debian/admin-panel
            git pull --ff-only
            cd backend
            npm install
            npm run build
            # Privileged setup (user, helper, sudoers, systemd unit, Docker socket proxy) + restart.
            # -n: fail instead of waiting for a password if the server was never bootstrapped
            sudo -n /home/debian/admin-panel/deploy/install.sh || {
              echo "::error::install.sh not allowed by sudoers yet: run once on the server: sudo /home/debian/admin-panel/deploy/install.sh"
              exit 1
            }

  deploy-frontend:
    # Same checkout as the backend job: wait for its git pull
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: debian
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/debian/admin-panel/frontend
            docker compose up -d --build
