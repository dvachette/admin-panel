name: Deploy admin panel

# Deploy releases only: push a version tag (git tag v1.2.0 && git push origin v1.2.0)
on:
  push:
    tags:
      - 'v*.*.*'

# Never run two deployments at the same time (they share the same checkout on the server)
concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TAG: ${{ github.ref_name }}
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: debian
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_TAG
          script: |
            set -euo pipefail
            [[ "$DEPLOY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag: $DEPLOY_TAG"; exit 1; }
            cd /home/debian/admin-panel
            git fetch --force --tags origin master
            # Only release commits that are part of master
            git merge-base --is-ancestor "refs/tags/$DEPLOY_TAG" origin/master || {
              echo "::error::$DEPLOY_TAG is not on master"
              exit 1
            }
            git checkout --detach "refs/tags/$DEPLOY_TAG"
            cd backend
            npm install
            npm run build
            # Privileged setup (user, helper, sudoers, systemd unit, Docker socket proxy) + restart.
            # -n: fail instead of waiting for a password if the server was never bootstrapped
            sudo -n /home/debian/admin-panel/deploy/install.sh || {
              echo "::error::install.sh not allowed by sudoers yet: run once on the server: sudo /home/debian/admin-panel/deploy/install.sh"
              exit 1
            }

  deploy-frontend:
    # Same checkout as the backend job: wait for its checkout
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: debian
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/debian/admin-panel/frontend
            docker compose up -d --build
